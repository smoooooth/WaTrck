<a
  class="wa-widget custom_action_cta"
  href="#"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Chat with us on WhatsApp"
  data-wa-phone="+201034285454"
  data-wa-cta-id="floating_whatsapp_widget"
>
  <span class="wa-widget__ring">
    <img
      class="wa-widget__photo"
      src="https://imagedelivery.net/U5iR5oiP6vsJdJpLjvlF7g/18345584-9a8d-4743-afef-36c54c6ed900/ProjectDetails2nd"
      alt="Property advisor available on WhatsApp"
      loading="lazy"
    />
  </span>

  <span class="wa-widget__badge" aria-hidden="true">
    <svg
      class="wa-widget__badge-icon"
      viewBox="0 0 32 32"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        fill="#ffffff"
        d="M16.001 3.2C8.93 3.2 3.2 8.93 3.2 16c0 2.26.6 4.47 1.73 6.42L3.2 28.8l6.53-1.71A12.74 12.74 0 0 0 16 28.8C23.07 28.8 28.8 23.07 28.8 16S23.07 3.2 16.001 3.2zm0 23.2c-1.98 0-3.92-.53-5.62-1.53l-.4-.24-3.87 1.01 1.03-3.77-.26-.42A10.55 10.55 0 0 1 5.4 16c0-5.85 4.76-10.6 10.6-10.6 2.83 0 5.5 1.1 7.5 3.11a10.53 10.53 0 0 1 3.1 7.49c0 5.85-4.76 10.6-10.6 10.6zm5.82-7.94c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.5-.16-.71.16-.21.32-.82 1.04-1 1.25-.18.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.58-.95-.85-1.59-1.9-1.78-2.22-.18-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.71-1.71-.97-2.34-.26-.62-.52-.54-.71-.54-.18-.01-.4-.01-.61-.01-.21 0-.56.08-.85.4-.29.32-1.11 1.09-1.11 2.64 0 1.56 1.14 3.06 1.3 3.27.16.21 2.24 3.42 5.43 4.8.76.33 1.35.52 1.81.67.76.24 1.45.21 2 .13.61-.09 1.89-.77 2.16-1.52.27-.75.27-1.38.19-1.52-.08-.14-.29-.21-.61-.37z"
      />

  </span>

  <span class="wa-widget__dot" aria-hidden="true"></span>
</a>

<button
  class="lead-fab"
  type="button"
  data-lead-open
  aria-label="Request project details by email"
>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <rect x="2.5" y="5" width="19" height="14" rx="1.5"></rect>
    <path d="M3 6.5l9 6.5 9-6.5"></path>
  </svg>
</button>

<script>
(function () {
  /* =========================================================
     PROJECT CONFIG — CHANGE THESE FOR EVERY NEW PROJECT
     ========================================================= */

  var DEFAULT_MESSAGE =
    "Hello, I would like to know more about Trump Golf Villas AIDA.";

  var PROJECT_ID = "AIDA_Oman";

  var WHATSAPP_CONVERSION_NAME = "Aida-ws-contact";

  var LEAD_VALUE_ESTIMATE = 70;

  /* Direct Google Ads conversion fired on WhatsApp click */
  var LEGACY_GOOGLE_ADS_SEND_TO =
    "AW-18357797105/LSmZCNTfp98cEPGB17FE";

  /* Direct Google Ads conversion fired after successful form */
  var LEGACY_LEAD_FORM_GOOGLE_ADS_SEND_TO =
    "AW-18357797105/2gfyCNHfp98cEPGB17FE";

  /* =========================================================
     GLOBAL / SYSTEM CONFIG — NORMALLY DO NOT CHANGE
     ========================================================= */

  var DEFAULT_PHONE = "+201034285454";
  var SAVE_TOKEN_ENDPOINT =
    "https://us-central1-aida-muscat-wa-tracking.cloudfunctions.net/saveToken";
  var ATTRIBUTION_TTL_HOURS = 24;

  // Keep this true while staging.
  var WATRCK_DEBUG = true;

  /* =========================================================
     EXISTING WEBFLOW FORM SUCCESS TRACKING
     DO NOT CHANGE DETECTION LOGIC
     ========================================================= */

  /* leafo success */

  function handleSuccessMessage(e) {
    "block" === window.getComputedStyle(e).display &&
      !e.hasAttribute("data-conversion-tracked") &&
      (
        gtag("event", "conversion", {
          send_to: LEGACY_LEAD_FORM_GOOGLE_ADS_SEND_TO
        }),
        e.setAttribute("data-conversion-tracked", "true")
      );
  }

  document.addEventListener("DOMContentLoaded", (function () {
    const e = new MutationObserver((function (e) {
      e.forEach((function (e) {
        if (
          "attributes" === e.type &&
          "style" === e.attributeName
        ) {
          const s = e.target;

          s.classList.contains("success-message") &&
            s.classList.contains("w-form-done") &&
            handleSuccessMessage(s);
        }

        "childList" === e.type &&
          e.addedNodes.forEach((function (e) {
            1 === e.nodeType &&
              e.classList &&
              e.classList.contains("success-message") &&
              e.classList.contains("w-form-done") &&
              (
                s(e),
                handleSuccessMessage(e)
              );
          }));
      }));
    }));

    function s(s) {
      e.observe(s, {
        attributes: !0,
        attributeFilter: ["style"]
      });
    }

    document
      .querySelectorAll(".success-message.w-form-done")
      .forEach((function (e) {
        s(e),
        handleSuccessMessage(e);
      }));

    e.observe(document.body, {
      childList: !0,
      subtree: !0
    });
  }));

  /* =========================================================
     TOKEN
     ========================================================= */

  function generateToken(len) {
    len = len || 7;

    var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    var output = "";
    var randomValues = crypto.getRandomValues(new Uint8Array(len));

    for (var i = 0; i < len; i++) {
      output += chars[randomValues[i] % chars.length];
    }

    return output;
  }

  /* =========================================================
     GCLID
     ========================================================= */

  function getGclid(ttlHours) {
    try {
      var params = new URLSearchParams(window.location.search);
      var urlGclid = params.get("gclid");

      /*
       * If a GCLID exists in the URL,
       * store it for later use.
       */
      if (urlGclid) {
        try {
          localStorage.setItem(
            "wa_gclid",
            JSON.stringify({
              gclid: urlGclid,
              ts: Date.now()
            })
          );
        } catch (e) {}

        return urlGclid;
      }

      /*
       * Otherwise check localStorage.
       */
      var raw = localStorage.getItem("wa_gclid");

      if (!raw) {
        return "";
      }

      var parsed;

      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        try {
          localStorage.removeItem("wa_gclid");
        } catch (_) {}

        return "";
      }

      if (!parsed.gclid || !parsed.ts) {
        try {
          localStorage.removeItem("wa_gclid");
        } catch (_) {}

        return "";
      }

      var ageMs = Date.now() - parsed.ts;
      var ttlMs = ttlHours * 60 * 60 * 1000;

      if (ageMs <= ttlMs) {
        return parsed.gclid;
      }

      try {
        localStorage.removeItem("wa_gclid");
      } catch (_) {}

      return "";
    } catch (e) {
      return "";
    }
  }

  /* =========================================================
     GOOGLE CAMPAIGN ID
     ========================================================= */

  function getCampaignId(ttlHours) {
    try {
      var params = new URLSearchParams(window.location.search);
      var urlCampaignId = params.get("campaign_id");

      if (urlCampaignId) {
        try {
          localStorage.setItem(
            "wa_campaign_id",
            JSON.stringify({
              cid: urlCampaignId,
              ts: Date.now()
            })
          );
        } catch (e) {}

        return urlCampaignId;
      }

      var raw = localStorage.getItem("wa_campaign_id");

      if (!raw) {
        return "";
      }

      var parsed;

      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        try {
          localStorage.removeItem("wa_campaign_id");
        } catch (_) {}

        return "";
      }

      if (!parsed.cid || !parsed.ts) {
        try {
          localStorage.removeItem("wa_campaign_id");
        } catch (_) {}

        return "";
      }

      var ageMs = Date.now() - parsed.ts;
      var ttlMs = ttlHours * 60 * 60 * 1000;

      if (ageMs <= ttlMs) {
        return parsed.cid;
      }

      try {
        localStorage.removeItem("wa_campaign_id");
      } catch (_) {}

      return "";
    } catch (e) {
      return "";
    }
  }

  /* =========================================================
     GOOGLE AD GROUP ID
     ========================================================= */

  function getAdGroupId(ttlHours) {
    try {
      var params = new URLSearchParams(window.location.search);
      var urlAdGroupId = params.get("adgroup_id");

      if (urlAdGroupId) {
        try {
          localStorage.setItem(
            "wa_adgroup_id",
            JSON.stringify({
              id: urlAdGroupId,
              ts: Date.now()
            })
          );
        } catch (e) {}

        return urlAdGroupId;
      }

      var raw = localStorage.getItem("wa_adgroup_id");

      if (!raw) {
        return "";
      }

      var parsed;

      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        try {
          localStorage.removeItem("wa_adgroup_id");
        } catch (_) {}

        return "";
      }

      if (!parsed.id || !parsed.ts) {
        try {
          localStorage.removeItem("wa_adgroup_id");
        } catch (_) {}

        return "";
      }

      var ageMs = Date.now() - parsed.ts;
      var ttlMs = ttlHours * 60 * 60 * 1000;

      if (ageMs <= ttlMs) {
        return parsed.id;
      }

      try {
        localStorage.removeItem("wa_adgroup_id");
      } catch (_) {}

      return "";
    } catch (e) {
      return "";
    }
  }

  /* =========================================================
     GOOGLE AD / CREATIVE ID
     ========================================================= */

  function getAdId(ttlHours) {
    try {
      var params = new URLSearchParams(window.location.search);
      var urlAdId = params.get("ad_id");

      if (urlAdId) {
        try {
          localStorage.setItem(
            "wa_ad_id",
            JSON.stringify({
              id: urlAdId,
              ts: Date.now()
            })
          );
        } catch (e) {}

        return urlAdId;
      }

      var raw = localStorage.getItem("wa_ad_id");

      if (!raw) {
        return "";
      }

      var parsed;

      try {
        parsed = JSON.parse(raw);
      } catch (e) {
        try {
          localStorage.removeItem("wa_ad_id");
        } catch (_) {}

        return "";
      }

      if (!parsed.id || !parsed.ts) {
        try {
          localStorage.removeItem("wa_ad_id");
        } catch (_) {}

        return "";
      }

      var ageMs = Date.now() - parsed.ts;
      var ttlMs = ttlHours * 60 * 60 * 1000;

      if (ageMs <= ttlMs) {
        return parsed.id;
      }

      try {
        localStorage.removeItem("wa_ad_id");
      } catch (_) {}

      return "";
    } catch (e) {
      return "";
    }
  }

  /* =========================================================
     PAGE
     ========================================================= */

  function getCanonicalPage() {
    try {
      var host = window.location.hostname.toLowerCase();

      if (host.indexOf("www.") === 0) {
        host = host.substring(4);
      }

      var path = window.location.pathname || "/";

      if (path !== "/" && path.charAt(path.length - 1) === "/") {
        path = path.substring(0, path.length - 1);
      }

      return (host + path).toLowerCase();
    } catch (e) {
      return "";
    }
  }

  /* =========================================================
     SAVE WATRCK CLICK
     ========================================================= */

  function saveWaTrckClick(payload) {
    /*
     * IMPORTANT:
     *
     * We deliberately DO NOT await this request before
     * opening WhatsApp.
     *
     * Your existing WhatsApp behavior therefore remains fast,
     * and browser popup blocking is not introduced.
     */
    fetch(SAVE_TOKEN_ENDPOINT, {
      method: "POST",
      mode: "cors",
      credentials: "omit",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload),
      keepalive: true
    })
      .then(function (response) {
        if (WATRCK_DEBUG) {
          console.log("[WaTrck] saveToken HTTP:", response.status);
        }

        return response.text();
      })
      .then(function (body) {
        if (WATRCK_DEBUG) {
          console.log("[WaTrck] saveToken response:", body);
        }
      })
      .catch(function (error) {
        console.error("[WaTrck] saveToken failed:", error);
      });
  }

  /* =========================================================
     CAPTURE ATTRIBUTION AS SOON AS PAGE LOADS
     ========================================================= */

  /*
   * This means that if the visitor arrives with:
   *
   * ?gclid=...
   * ?campaign_id=...
   *
   * the values are stored immediately instead of waiting
   * until the WhatsApp button is clicked.
   */
  getGclid(ATTRIBUTION_TTL_HOURS);
  getCampaignId(ATTRIBUTION_TTL_HOURS);
  getAdGroupId(ATTRIBUTION_TTL_HOURS);
  getAdId(ATTRIBUTION_TTL_HOURS);

  /* =========================================================
     EXISTING WHATSAPP CLICK HANDLER + WATRCK
     ========================================================= */

  document.addEventListener("click", function (e) {
    var cta = e.target.closest(".custom_action_cta");

    if (!cta) {
      return;
    }

    e.preventDefault();

    /* ---------------------------------------------------------
       EXISTING CTA DATA
       --------------------------------------------------------- */

    var rawPhone = cta.getAttribute("data-wa-phone") || DEFAULT_PHONE;

    /*
     * One project-wide default message.
     * Individual CTAs can still optionally override this
     * by using data-wa-message.
     */
    var message = cta.getAttribute("data-wa-message") || DEFAULT_MESSAGE;

    if (!rawPhone) {
      return;
    }

    var phone = rawPhone.replace(/[^0-9]/g, "");

    /* ---------------------------------------------------------
       NEW WATRCK DATA
       --------------------------------------------------------- */

    var token = generateToken(7);
    var gclid = getGclid(ATTRIBUTION_TTL_HOURS) || "";
    var campaignId = getCampaignId(ATTRIBUTION_TTL_HOURS) || "";
    var adGroupId = getAdGroupId(ATTRIBUTION_TTL_HOURS) || "";
    var adId = getAdId(ATTRIBUTION_TTL_HOURS) || "";
    var ctaId =
      cta.getAttribute("data-wa-cta-id") ||
      cta.id ||
      "custom_action_cta";

    var payload = {
      token: token,
      gclid: gclid,
      campaign_id: campaignId,
      adgroup_id: adGroupId,
      ad_id: adId,
      ts: new Date().toISOString(),
      page: getCanonicalPage(),
      projectId: PROJECT_ID,
      ctaId: ctaId,
      lead_value_estimate: LEAD_VALUE_ESTIMATE,
      conversion_name: WHATSAPP_CONVERSION_NAME,
      used: false
    };

    if (WATRCK_DEBUG) {
      console.log("[WaTrck] outbound click payload:", payload);
    }

    /*
     * Send WaTrck record to Firebase.
     *
     * Fire-and-forget so WhatsApp opening remains immediate.
     */
    saveWaTrckClick(payload);

    /* ---------------------------------------------------------
       ADD TOKEN TO WHATSAPP MESSAGE
       --------------------------------------------------------- */

    var messageWithToken = message
      ? message + " Ref: #" + token
      : "Ref: #" + token;

    var url =
      "https://api.whatsapp.com/send?phone=" +
      phone +
      "&text=" +
      encodeURIComponent(messageWithToken);

    /* ---------------------------------------------------------
       EXISTING GOOGLE ADS WHATSAPP TRACKING
       --------------------------------------------------------- */

    if (typeof gtag === "function") {
      gtag("event", "conversion", {
        "send_to": LEGACY_GOOGLE_ADS_SEND_TO
      });
    }

    /* ---------------------------------------------------------
       EXISTING WHATSAPP OPEN
       --------------------------------------------------------- */

    window.open(url, "_blank");
  });
})();
</script>
